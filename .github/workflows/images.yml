# Finds an image and its source for every timeline record, person and new cover, and
# commits lib/images.json. Runs when the list of things needing images changes, or by hand.
name: Images

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Search 'records' or 'people' again from scratch (blank: only what's new or missing)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - scripts/image-requests.json
      - scripts/resolve-images.mjs
      - scripts/image-overrides.json

permissions:
  contents: write

concurrency:
  group: images
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/resolve-images.mjs
        env:
          ONLY: ${{ github.event.inputs.only }}
          CHECK_PEOPLE: "1"
      - name: Commit lib/images.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add lib/images.json scripts/people-photo-check.json
          git diff --cached --quiet || (git commit -m "Update images and their sources" && git push)
